[project]
name = "sofa"
version = "2.0.0"
description = "A minimalist tool for removing faces from video"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10,<3.13"
authors = [{ name = "SOFA Contributors" }]
keywords = ["face-detection", "video-processing", "privacy", "anonymization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "PyQt5>=5.15,<6",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "onnx>=1.16",
    "pandas>=2.2",
    "moviepy>=1.0.3,<2",
]

[project.scripts]
sofa = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "single"
